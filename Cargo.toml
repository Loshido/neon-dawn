[package]
name = "neon-dawn"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1
codegen-units = 8

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1

[dependencies]
axum = { version = "0.8.8", features = ["ws"] }
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.6.8", features = ["fs", "set-header"] }
