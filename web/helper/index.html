<!DOCTYPE html>
<html lang="fr">
	<head>
		<title>🛰️ Mission Neon-Dawn</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
        <link rel="stylesheet" href="/styles/helper.css">
    </head>
	<body>
        <aside>
            <a href="/">
                🛰️ Revenir à la simulation
            </a>
            <div id="introduction">
                🪶 Introduction
            </div>
            <div id="objectifs">
                🪸 Objectifs
            </div>
            <h3>REST</h3>
            <div data-post id="launch">
                <span class="method">POST</span>
                /orbit/launch
            </div>
            <div data-post id="update">
                <span class="method">POST</span>
                /orbit/update
            </div>
            <div data-post id="signal">
                <span class="method">POST</span>
                /orbit/signal
            </div>
            <h3>
                WS
            </h3>
            <div data-get id="ws">
                <span class="method">GET</span>
                /ws
            </div>
            <h3>
                Observation
            </h3>
            <div data-get id="listen">
                <span class="method">GET</span>
                /listen
            </div>
        </aside>
        <main>
        </main>
        <script type="module" src="/helper/main.ts"></script>
	</body>
    <template id="introduction-template">
        <h1>Introduction</h1>
        <p>
            Comment on fait décoler un satellite?
        </p>
        <hr>
        <p>
            L'Agence spatiale européene ESB fait une appel d'offre,
            l'agence cherche un satellite pour mesurer les effets du changement climatique.
        </p>
        <p>
            Votre objectif est de <strong>concevoir un satellite</strong> avec suffisament de fonctionnalités pour attirer l'oeil de l'ESB!<br/>
        </p>
        <div>
            <a href="/helper/#objectifs">
                🪸 Objectifs
            </a>
            <p>
                Lire les objectifs à accomplir
            </p>
        </div>
        <div>
            <a href="/">
                🛰️ Simulation
            </a>
            <p>
                Accès à la simulation en temps réel
            </p>
        </div>

        <h4>Les points de terminaisons <i style="color:#FFF4;">(endpoints / routes)</i></h4>
        <div>
            <a href="/helper/#launch" data-post>
                <span class="method">POST</span>
                /orbit/launch
            </a>
            <a href="/helper/#update" data-post>
                <span class="method">POST</span>
                /orbit/update
            </a>
            <a href="/helper/#signal" data-post>
                <span class="method">POST</span>
                /orbit/signal
            </a>
            <a href="/helper/#ws" data-get>
                <span class="method">GET</span>
                /ws
            </a>
            <a href="/helper/#listen" data-get>
                <span class="method">GET</span>
                /listen
            </a>
        </div>
    </template>
    <template id="objectifs-template">
        <h1>Objectifs</h1>
        <p>
            Les possibilités sont infinies
        </p>
        <hr>
    </template>
    <template id="launch-template">
        <h1 data-post>
            <span class="method">POST</span>
            /orbit/launch
        </h1>
        <p>
            Lancer un satellite en orbite.
        </p>
        <hr>
    </template>
    <template id="update-template">
        <h1 data-post>
            <span class="method">POST</span>
            /orbit/update
        </h1>
        <p>
            Modifier le satellite en orbite.
        </p>
        <hr>
    </template>
    <template id="signal-template">
        <h1 data-post>
            <span class="method">POST</span>
            /orbit/signal
        </h1>
        <p>
            Signaler la nouvelle position du satellite.
        </p>
        <hr>
    </template>
    <template id="ws-template">
        <h1 data-get>
            <span class="method">GET</span>
            /ws
        </h1>
        <p>
            Passer sur le protocole Websocket.
        </p>
        <hr>
    </template>
    <template id="listen-template">
        <h1 data-get>
            <span class="method">GET</span>
            /listen
        </h1>
        <p>
            Écouter les évènements.
        </p>
        <hr>
        <div class="actions">
            <button id="listen-start" class="active">Écouter</button>
            <button id="listen-stop">Arrêter</button>
        </div>
        <div id="listen-output"></div>
    </template>
</html>
